# Gates: the requirements graph must be structurally sound and the test suite
# green on every push. The graph check is non-strict on purpose: items amended
# after ratification wait as `ratified-stale` for a human to re-sign, and
# `--strict` would report that as red. Structural faults (ungrounded items,
# bad links, illegal status moves) still fail here.
name: idd-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install throughline (version floor, always upgraded)
        run: python -m pip install --upgrade "throughline>=3.11.3"
      - run: tl --version
      - run: tl -C idd check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the tool and the test runner (wheels only, NFR-0002)
        run: python -m pip install --only-binary ":all:" -e ".[test]"
      - run: model-box-maker --version
      # TEST-0031 measures the NFR-0001 bound on this machine; a shared runner is slower than a desktop.
      - run: python -m pytest -q --durations=8
