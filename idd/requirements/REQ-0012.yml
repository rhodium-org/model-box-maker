uid: REQ-0012
type: requirement
status: ratified
title: The outside is a cuboid with rounded vertical edges
text: The closed box is a cuboid. Its vertical edges are rounded to the corner radius,
  which may be zero. The top of the lid and the underside of the base are flat.
rationale: A cuboid stacks, wraps in paper and takes a label. Rounded vertical edges
  spread a corner impact and stop a crack starting at the corner.
normative: true
