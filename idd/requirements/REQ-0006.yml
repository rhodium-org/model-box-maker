uid: REQ-0006
type: requirement
status: implemented
title: A report explains the box
text: Beside the geometry the tool writes <stem>-report.json. It records the input
  file and scale, the orientation mode, the rotation applied to the model as a 3
  by 3 matrix and as X, Y, Z angles in degrees, the translation that places the model
  at rest in the base, the outer size of the closed box, the outer volume, the cavity
  volume, the free volume as a fraction of the cavity when the mesh is watertight,
  every dimension option with the value used, and the paths written. For an automatic
  orientation it also lists the ten best candidates with their scores and says why
  the winner won.
rationale: The orientation is the decision most likely to be questioned, so the tool
  has to show its working. A candidate table lets the operator pick a runner-up and
  re-run with --orientation without guessing angles. The free volume tells the operator
  how much the model can move before adding padding.
normative: true
