uid: REQ-0020
type: requirement
status: ratified
title: One command with plain exit codes
text: The tool is run as model-box-maker MODEL [options]. --help lists every option
  with its default. On success it exits 0 and prints the files written and a one-line
  summary of the pose chosen and the box size. A usage error exits 2. Any other failure
  exits 1 with a single line saying what went wrong. It never leaves a partial set
  of files.
rationale: The tool is meant to be run from a shell and from other scripts. Stable
  exit codes and a one-line failure are what a script can act on, and never leaving
  a half-written set means a failed run cannot be mistaken for a good one.
normative: true
