uid: REQ-0011
type: requirement
status: verified
title: No wall is thinner than the wall thickness
text: The inner face of the wall is the cavity outline. The outer face is the smallest
  rounded rectangle that keeps every point of the outline at least the wall thickness
  from the outside. Below the lip the wall is thicker by the skirt thickness and
  the fit gap, so the lid sits flush. Rounding the vertical edges never cuts inside
  that thickness.
rationale: The wall is what a crush load acts on. Measuring the thickness from the
  cavity outline, not from a bounding box, means a model with a corner near the edge
  still gets a full wall there.
normative: true
