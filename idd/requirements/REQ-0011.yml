uid: REQ-0011
type: requirement
status: verified
title: No wall is thinner than the wall thickness
text: The inner face of the wall is the cavity outline. At the lip, no point of the
  outer face is nearer the outline than the wall thickness. Below the lip the wall
  is thicker by the skirt thickness and the fit gap, so the lid sits flush. Rounding
  a vertical edge never cuts inside that thickness.
rationale: The wall is what a crush load acts on. Measuring the thickness from the
  cavity outline, not from a bounding box, means a model with a corner near the edge
  still gets a full wall there.
normative: true
