uid: REQ-0015
type: requirement
status: implemented
title: Walls can be opened into a lattice
text: --walls takes solid, hex or diamond, and defaults to solid. With a pattern,
  the outer wall is cut through with that lattice wherever it stands beside open
  cavity, each hole cut inward along the wall's local outward normal. No hole is
  wider than --max-hole, default 6 mm. Solid material stays where the outline bends
  sharply, over the whole lip and the wall for the band height below it, and, at
  each place along the wall, from the underside of the base up to the cradle beside
  that place plus the band height. The band height is the option --band, default
  4 mm. Every hole prints without support.
rationale: The operator allowed mesh walls to save filament and time. The bands are
  where crush loads travel, so the lattice stays out of them. Solid is the default
  because a solid box is the safer one and the pattern is a saving the operator chooses.
  The band above the cradle is measured beside each hole, not at the cradle's highest
  point anywhere; measured globally, a cradle that rose near the lip on one side
  left the duck box with no holes at all (2026-09-20).
normative: true
