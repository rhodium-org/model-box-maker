uid: REQ-0021
type: requirement
status: verified
title: The cut-back box still stands
text: The base stands on its flat underside. The tool takes the footprint of the
  closed box, the convex hull of that footprint, and the distance from the footprint's
  centroid to the nearest edge of the hull; with the mass taken at half the box height
  it reports the angle the box can be tilted before it tips. When the cut-back footprint
  would tip below 20 degrees and the full rectangle would not, the tool keeps the
  rectangle and the report says why. When neither reaches 20 degrees the tool warns
  on stderr and carries on. The report always records the tipping angle and which
  outline was used.
rationale: Henry's condition for cutting the box back was that it can still be put
  down on a flat surface and not fall over. The support polygon of a box on a table
  is the convex hull of its footprint, so a concave outline costs no stability by
  itself. Twenty degrees is a mug, not a wine glass, and is a judgement.
normative: true
