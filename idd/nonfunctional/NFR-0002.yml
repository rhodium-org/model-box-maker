uid: NFR-0002
type: nfr
status: ratified
title: Installs with pipx and needs no compiler
text: The tool is a Python package installable with pipx from the repository. Its
  dependencies ship binary wheels for Linux, macOS and Windows on Python 3.10 and
  later, so no compiler, CAD kernel or external program is needed.
rationale: The sibling tools in this workspace install the same way and the operator
  expects one command to install. A dependency on OpenSCAD, CGAL or Blender would
  make the box depend on a second installation.
normative: true
