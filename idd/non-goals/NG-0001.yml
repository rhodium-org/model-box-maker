uid: NG-0001
type: non_goal
status: proposed
title: No hinge, latch, snap or living joint
text: The lid is held by the fit of its skirt over the lip and by whatever tape the
  sender adds. The tool does not add a hinge, a latch, a snap or a flexing joint.
rationale: The operator asked for a lip and no hinge. A printed hinge or snap is
  the first thing to break in the post, and a broken one drops the lid.
normative: false
attrs:
  origin: ai
