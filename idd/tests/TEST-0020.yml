uid: TEST-0020
type: test
status: implemented
title: The outside stays between the wall and the greatest wall from the cavity
text: Every point of the base's outer outline lies at least the wall thickness and
  at most --wall-max from the cavity outline. Where the outline coincides with the
  rectangle, its corners are rounded to the corner radius, sharp when the radius
  is zero. The base underside and the lid top are each a single plane.
