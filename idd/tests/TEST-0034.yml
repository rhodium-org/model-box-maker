title: A tippy outline keeps the rectangle and says so
text: A triangular prism kept standing on its end, whose cut-back footprint would
  tip below 20 degrees while the full rectangle would not, is boxed with the full
  rectangle and the report says why; a flat plate reports a tipping angle over 45
  degrees with the cut-back outline.
