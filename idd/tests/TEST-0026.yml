title: Two closed bodies, each the way it prints
text: Both files load as watertight manifold bodies with positive volume. The base's
  underside is on Z zero and its cavity is open at its top. The lid's plate is on
  Z zero and its skirt rises from it. --format 3mf writes 3MF files that load the
  same way.
